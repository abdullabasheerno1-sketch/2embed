<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulthan TV - Direct Movie Player</title>
    <style>
        body, html { 
            background: #000; 
            color: #fff; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .search-box { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 10px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); 
        }
        input { 
            padding: 12px; 
            width: 250px; 
            border-radius: 4px; 
            border: 1px solid #444; 
            background: #2c2c2c; 
            color: #fff; 
            font-size: 16px; 
            outline: none; 
        }
        button { 
            padding: 12px 20px; 
            background: #e50914; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-left: 5px; 
        }
        h2 { color: #e50914; margin-bottom: 15px; }
        .player-container { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            display: none; 
        }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>

    <div class="search-overlay" id="searchOverlay">
        <div class="search-box">
            <h2>Sulthan TV Player</h2>
            <input type="text" id="movieId" placeholder="Enter Movie ID (e.g. 56)">
            <button onclick="playMovie()">Play</button>
        </div>
    </div>

    <div class="player-container" id="playerContainer">
        <iframe id="embedFrame" src="" allowfullscreen></iframe>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        if (movieId) {
            startPlayer(movieId);
        }

        function playMovie() {
            const id = document.getElementById('movieId').value.trim();
            if (id) {
                window.history.pushState({}, '', '?id=' + id);
                startPlayer(id);
            }
        }

        function startPlayer(id) {
            document.getElementById('searchOverlay').style.display = 'none';
            document.getElementById('playerContainer').style.display = 'block';
            document.getElementById('embedFrame').src = "https://www.2embed.cc/embed/" + id;
        }
    </script>
</body>
</html>
