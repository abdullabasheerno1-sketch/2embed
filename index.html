<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulthan TV - Direct Player</title>
    <style>
        body { 
            background: #000; 
            color: #fff; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .box { text-align: center; background: #111; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(255,255,255,0.1); }
        input { padding: 12px; width: 250px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 20px; background: #e50914; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Sulthan TV 2Embed Direct</h2>
        <p>Enter Movie ID to Watch Directly</p>
        <input type="text" id="movieId" placeholder="Enter TMDB ID (e.g. 329)">
        <button onclick="playMovie()">Play Now</button>
    </div>

    <script>
        // URL-ൽ ഓട്ടോമാറ്റിക്കായി ID ഉണ്ടെങ്കിൽ നേരെ പ്ലെയറിലേക്ക് പോകും
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
            window.location.href = "https://www.2embed.cc/embed/" + id;
        }

        function playMovie() {
            const val = document.getElementById('movieId').value.trim();
            if (val) {
                // ഡൊമൈൻ ലിങ്കിലേക്ക് ഐഡി ചേഞ്ച് ചെയ്ത് നേരെ 2Embed പ്ലെയറിലേക്ക് വിടും
                window.location.href = "https://www.2embed.cc/embed/" + val;
            }
        }
    </script>
</body>
</html>
